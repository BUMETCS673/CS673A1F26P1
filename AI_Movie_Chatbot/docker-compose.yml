# AI-USAGE SUMMARY
# Authors: Yuchen Xu (original), Daniel Winnie
# Tools: Yuchen Xu: not yet reported by the author - author to confirm in the AIUsageLog; Daniel's edits: OpenAI Codex (CLI agent), prompted by Daniel Winnie and Claude Code (Claude Opus), prompted by Daniel Winnie
# Overall AI Contribution: to be confirmed; Daniel's edits ~90%
# AI-Assisted Areas: API + nginx services, live reload
# Human Contributions: Yuchen Xu: original Docker setup; Daniel Winnie: requirements and prompts, design choices (FastAPI, Docker layout, beginner-friendly comments), reviewed every change before committing, decided what to keep
# Notes/Verification: ran start_project.sh in WSL + Docker, checked localhost:3000, :8080/docs and /api/health/database

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Dummy local defaults match User_Database; override using this folder's .env.
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-movie_users}
      DB_USER: ${DB_USER:-movie_admin}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-2000}
      PYTHONDONTWRITEBYTECODE: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Development source only; installed dependencies remain in the image.
      - ./app:/app/app:ro
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-include
      - "*.json"
    networks:
      default:
      development:
        aliases:
          - api
    # Wait until Python serves a response before calling the backend ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); assert response.status == 200 and json.load(response) == {'status': 'ok'}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # Check the same nginx address that forwards requests to Python.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

# PostgreSQL's Compose project owns this network; start it first.
networks:
  development:
    external: true
    name: cs673_event_planning
