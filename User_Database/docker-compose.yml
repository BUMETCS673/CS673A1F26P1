# Run commands from this folder so Compose can find this file.
services:
  database:
    # Use the same PostgreSQL major version on each teammate's computer.
    image: postgres:17
    environment:
      # These are shared LOCAL DEVELOPMENT credentials, not real user accounts.
      # No .env file or additional configuration is needed for this starter.
      POSTGRES_DB: movie_users
      POSTGRES_USER: movie_admin
      POSTGRES_PASSWORD: local_dev_password
    ports:
      # Only accept connections from this computer, on port 5432.
      - "127.0.0.1:5432:5432"
    volumes:
      # Keep database data when the container stops or is recreated.
      # Docker manages this volume outside the Git repository.
      - user_data:/var/lib/postgresql/data
      # PostgreSQL runs this SQL file only when the database is first created.
      # :ro means the container can read the file but cannot change it.
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # --wait in the setup command waits for PostgreSQL to accept connections.
      test: ["CMD-SHELL", "pg_isready -U movie_admin -d movie_users"]
      interval: 5s
      timeout: 3s
      retries: 10

# A named volume stores each developer's own database on their computer.
volumes:
  user_data:
