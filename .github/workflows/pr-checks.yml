# AI-USAGE SUMMARY
# Authors: Daniel Winnie
# Tools: Claude Code (Claude Opus), prompted by Daniel Winnie
# Overall AI Contribution: ~90%
# AI-Assisted Areas: GitHub Actions workflow for Python tests, live database tests, frontend tests, and build
# Human Contributions: Daniel Winnie: requirements and prompts, design choices, reviewed every change before committing, decided what to keep
# Notes/Verification: each job's commands were run locally first (unit tests, npm test, npm run build)

# Runs on every pull request to main and every push to main. If any job fails,
# the PR page shows a red X; click "Details" next to the failing job to read its log.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; it needs no secrets, so PRs from forks are safe.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code/AI_Movie_Chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/AI_Movie_Chatbot/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      # Same command as the README; it runs tests/test_*.py and needs no database.
      - run: python -m unittest discover -s tests -v

  python-live-tests:
    name: Python live database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Matches User_Database/docker-compose.yml (dummy local development credentials).
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: movie_users
          POSTGRES_USER: movie_admin
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_admin -d movie_users"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: movie_users
      DB_USER: movie_admin
      DB_PASSWORD: local_dev_password
      PGPASSWORD: local_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/AI_Movie_Chatbot/requirements*.txt
      - name: Create the schema (init.sql, then every migration in order)
        working-directory: code/User_Database
        run: |
          psql -h 127.0.0.1 -U movie_admin -d movie_users -q -v ON_ERROR_STOP=1 -f init.sql
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U movie_admin -d movie_users -q -v ON_ERROR_STOP=1 -f "$migration"
          done
      - working-directory: code/AI_Movie_Chatbot
        run: python -m pip install -r requirements-dev.txt
      # Every tests/live_*.py file, so new live tests are picked up automatically.
      - working-directory: code/AI_Movie_Chatbot
        run: python -m unittest discover -s tests -p 'live_*.py' -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code/Web_Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major version as code/Web_Application/Dockerfile.
          node-version: 22
          cache: npm
          cache-dependency-path: code/Web_Application/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
